[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vf-osint"
version = "0.5.0"
description = "Graph Intelligence System auditavel para oportunidades de seguro garantia judicial fiscal"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=5.0",
  "reportlab>=4.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["tavily-python>=0.7"]

[project.scripts]
vf-osint = "vf_osint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
